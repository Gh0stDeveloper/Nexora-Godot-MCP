name: CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python MCP gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Ruff
        run: uv run ruff check src tests
      - name: Mypy
        run: uv run mypy
      - name: Tests
        run: uv run pytest
      - name: Compile Python surfaces
        run: python -m compileall -q src tests

  godot-addon:
    name: Godot 4.6.3 addon smoke
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.6.3
    steps:
      - uses: actions/checkout@v4
      - name: Install addon into fixture
        run: |
          mkdir -p tests/godot_fixture/addons
          cp -R godot_addon/addons/nexora_godot_mcp tests/godot_fixture/addons/
          mkdir -p tests/godot_fixture/.nexora-godot
          printf '{"host":"127.0.0.1","port":9877,"secret":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","auto_start":false}\n' > tests/godot_fixture/.nexora-godot/bridge.json
      - name: Parse project and run Phase B editor smoke
        run: |
          godot --headless --editor --path tests/godot_fixture --quit-after 5 > /tmp/nexora-godot.log 2>&1
          cat /tmp/nexora-godot.log
          grep -q "NEXORA_PHASE_B_SMOKE_OK" /tmp/nexora-godot.log
